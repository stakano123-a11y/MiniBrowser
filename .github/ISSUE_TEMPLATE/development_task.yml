name: 開発タスク
description: 新機能、改善、検証作業を受け渡します
title: "[Task] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: 目的
      description: 完了時に実現している状態を記載してください。
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 要件
      description: 必要な挙動を箇条書きで記載してください。
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 対象外
      description: 今回変更しない範囲があれば記載してください。
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 静的検証、Actions、実機確認などの受け入れ条件を記載してください。
    validations:
      required: true
