name: 不具合報告
description: MiniBrowserの再現可能な不具合を記録します
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 症状
      description: 何が起きたかを簡潔に記載してください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 操作を順番に記載してください。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 環境
      description: iPhone機種、iOSバージョン、IPAのSHA-256またはActions Run番号
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: ログ・画像
      description: クラッシュログ、MiniBrowserデバッグログ、スクリーンショットを添付してください。秘密情報は含めないでください。
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 修正済みと判断できる確認項目を記載してください。
    validations:
      required: true
