name: Build and deliver MiniBrowser IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deliver:
    uses: ./.github/workflows/reusable-ios-unsigned-build-deliver.yml
    with:
      app_name: MiniBrowser
      artifact_name: MiniBrowser-unsigned-ipa
      destination_filename: MiniBrowser.ipa
